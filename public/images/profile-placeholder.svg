<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Outer Glow Frame -->
  <rect x="10" y="10" width="380" height="380" rx="40" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Inner Silhouette / Stylized Avatar -->
  <circle cx="200" cy="155" r="65" fill="#1E293B" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4" />
  <path d="M110 320 C110 240, 290 240, 290 320 Z" fill="#1E293B" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Modern Tech Badges -->
  <rect x="145" y="140" width="110" height="30" rx="8" fill="#08090C" stroke="#00F0FF" stroke-width="1.5" />
  <text x="200" y="160" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#00F0FF">HOR TOLA</text>
  
  <text x="200" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748B">Drop your photo into /public/images/profile.jpg</text>
</svg>
